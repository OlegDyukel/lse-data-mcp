version: 2

updates:
  # Keeps the commit-pinned actions in ci.yml current; Dependabot reads the
  # trailing "# v6" comment and rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
