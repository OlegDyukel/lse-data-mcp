name: Release

# Publishing to PyPI is irreversible: a version number can be yanked but never
# reused. Every path here therefore builds and tests before it uploads, and a
# tag that disagrees with the packaged version fails the run instead of
# publishing under the wrong number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual runs publish to TestPyPI only."
        type: choice
        options: ["testpypi"]
        default: "testpypi"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag can be
      # repointed at new code by whoever owns the repository.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, development dependencies, and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      # CI covers pushes and pull requests, but a tag can point at any commit.
      # Re-run the checks against exactly what is about to be published.
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Run unit tests
        run: pytest

      - name: Check the tag matches the packaged version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            echo "Bump the version, or retag, so the published number is the intended one." >&2
            exit 1
          fi
          echo "Publishing version ${version}."

      - name: Build the source distribution and wheel
        run: python -m build

      - name: Check distribution metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lse-data-mcp
    # Trusted Publishing mints a short-lived token from this OIDC claim, so the
    # repository holds no PyPI credential of its own. The build job deliberately
    # runs without this permission: packaging executes project code, and that
    # code must never be able to mint an upload token.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # TestPyPI is where a release is rehearsed, so a repeat dispatch of the
      # same version must not fail: a filename cannot be reused on any index,
      # and re-running the rehearsal is the point of having one. The real PyPI
      # job deliberately keeps the default, where a duplicate upload is an
      # error worth seeing rather than a silent no-op.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/lse-data-mcp
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The bundle is built from the tag it will ship with, so it can never advertise
  # a version PyPI does not serve. It carries no server source of its own: a
  # manifest, a dependency pin, and a launcher that imports the installed package.
  #
  # Deliberately no `permissions:` block. The workflow default is read, and this
  # job runs third-party npm tooling over the repository — that must never hold a
  # token which can write to it.
  bundle:
    name: Build the Claude Desktop bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Generated, never hand-edited, so a version bump cannot leave the bundle
      # pinning the previous release. CI checks the committed files agree; this
      # regenerates them from the tag actually being released.
      - name: Generate the bundle version and pin
        run: python scripts/sync_bundle_version.py

      # Pinned to an exact version: this tooling decides what lands in the
      # archive, and a floating major could change that between releases.
      # `validate` takes the manifest path, not the directory.
      - name: Validate the manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json

      # The output path is explicit. Given no second argument the CLI names the
      # archive after the directory it packed — mcpb.mcpb — which would not match
      # the releases/latest/download/lse-data-mcp.mcpb URL the README links to.
      - name: Pack the bundle
        run: |
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb bundle/lse-data-mcp.mcpb

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: bundle/lse-data-mcp.mcpb
          if-no-files-found: error

  # The GitHub release is the human-facing announcement, so it is created only
  # once the package it announces is actually on PyPI. Doing this by hand was
  # forgotten for v0.1.2 and v0.1.3, which left the repository sidebar naming
  # v0.1.1 as the latest version while PyPI already served a newer one.
  github-release:
    name: Create the GitHub release
    needs: [publish-pypi, bundle]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The only job here that writes to the repository. The workflow default is
    # read, and the build job in particular must stay read-only, since packaging
    # executes project code.
    permissions:
      contents: write

    steps:
      # The asset arrives as an artifact rather than from a checkout: it must be
      # the exact file the bundle job validated and packed, not one rebuilt here
      # from a tree that might resolve differently.
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: bundle/

      # No checkout. `--generate-notes` asks the API to assemble the notes from
      # the pull requests merged since the previous release, so the tag name and
      # GH_REPO are all this needs; a working tree would be one more thing to
      # keep in step with the tag.
      #
      # The bundle is passed to `create` rather than uploaded afterwards, so the
      # release is never briefly visible without the asset the README links to.
      #
      # --verify-tag fails when the tag is missing instead of quietly creating
      # one, so a mistyped ref cannot invent a release. --latest is right while
      # releases only move forward; cutting one from an older branch would mean
      # dropping it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --latest \
            bundle/lse-data-mcp.mcpb
