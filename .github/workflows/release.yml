name: Release

# Publishing to PyPI is irreversible: a version number can be yanked but never
# reused. Every path here therefore builds and tests before it uploads, and a
# tag that disagrees with the packaged version fails the run instead of
# publishing under the wrong number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual runs publish to TestPyPI only."
        type: choice
        options: ["testpypi"]
        default: "testpypi"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag can be
      # repointed at new code by whoever owns the repository.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, development dependencies, and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      # CI covers pushes and pull requests, but a tag can point at any commit.
      # Re-run the checks against exactly what is about to be published.
      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src tests

      - name: Run unit tests
        run: pytest

      - name: Check the tag matches the packaged version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            echo "Bump the version, or retag, so the published number is the intended one." >&2
            exit 1
          fi
          echo "Publishing version ${version}."

      - name: Build the source distribution and wheel
        run: python -m build

      - name: Check distribution metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lse-data-mcp
    # Trusted Publishing mints a short-lived token from this OIDC claim, so the
    # repository holds no PyPI credential of its own. The build job deliberately
    # runs without this permission: packaging executes project code, and that
    # code must never be able to mint an upload token.
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # TestPyPI is where a release is rehearsed, so a repeat dispatch of the
      # same version must not fail: a filename cannot be reused on any index,
      # and re-running the rehearsal is the point of having one. The real PyPI
      # job deliberately keeps the default, where a duplicate upload is an
      # error worth seeing rather than a silent no-op.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/lse-data-mcp
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
