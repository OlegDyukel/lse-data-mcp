[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lse-data-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the London Strategic Edge market-data API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oleg Diukel" }]
keywords = ["mcp", "market-data", "finance", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.5,<5",
    "lse-data>=0.14,<1",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
lse-data-mcp = "lse_data_mcp.server:main"

[project.urls]
Repository = "https://github.com/OlegDyukel/lse-data-mcp"
Issues = "https://github.com/OlegDyukel/lse-data-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lse_data_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=lse_data_mcp --cov-report=term-missing"
testpaths = ["tests"]
