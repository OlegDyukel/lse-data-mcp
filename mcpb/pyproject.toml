# The bundle's dependency declaration, not a package of its own.
#
# There is deliberately no [build-system] table: that is what makes `uv` treat
# this directory as a virtual project — an environment to resolve rather than a
# package to build. Adding one would make `uv` try to build the bundle and fail.
#
# The version and the pin below are generated from the root pyproject.toml by
# scripts/sync_bundle_version.py, which the release workflow runs before packing.
# Do not hand-edit them.
[project]
name = "lse-data-mcp-bundle"
version = "0.1.6"
description = "Claude Desktop bundle that installs the published lse-data-mcp release"
requires-python = ">=3.11"

# An exact pin, never a range: a bundle a user already downloaded must keep
# installing the same code that PyPI served for this release.
dependencies = ["lse-data-mcp==0.1.6"]
